<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Choose the correct answer</h1>
        <div class="test">
            <div class="question">Qno:1  what comes after 1</div>
            <div class="options">
                <div class="option">
                    <input type="radio" id="option-a" name="question1" value="a">
                    <label for="option-a">a.) 3</label>
                </div>
                <div class="option">
                    <input type="radio" id="option-b" name="question1" value="b">
                    <label for="option-b">b.) 2</label>
                </div>
                <div class="option">
                    <input type="radio" id="option-c" name="question1" value="c">
                    <label for="option-c">c.) 5</label>
                </div>
                <div class="option">
                    <input type="radio" id="option-d" name="question1" value="d">
                    <label for="option-d">d.) 4</label>
                </div>
            </div>
        </div>
        <div class="btn-container">
            <button class="submit-btn">Submit</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
